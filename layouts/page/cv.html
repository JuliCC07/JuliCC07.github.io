{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <div class="print-actions hide-on-print">
      <button class="cv-print-btn" onclick="window.print()" type="button" aria-label="Print or save CV as PDF">
        <svg class="cv-print-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        <span>Print / Save as PDF</span>
      </button>
    </div>
  </header>
  
  <div class="post-content cv-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
